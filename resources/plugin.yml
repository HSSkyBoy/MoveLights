name: NyaEeMC
main: top.nkbe.NyaEeMC
version: 1.4.0
author: NkBe, _TwT
api-version: 1.17
commands:
  nyae:
    description: 主命令
    usage: §a/<command> help 查看帮助
    aliases: [nyaemc, movel]
permissions:
  nyaemc.help:
    description: "查看帮助"
    default: true
  nyaemc.reload:
    description: "重载插件配置"
    default: op
  nyaemc.toggle:
    description: "总开关移动光源"
    default: op
  nyaemc.player.use:
    description: "玩家能使用移动光源"
    default: true
  nyaemc.player.onoff:
    description: "玩家对自己开关移动光源"
    default: true
  nyaemc.note:
    description: "设定玩家备注"
    default: op
  nyaemc.op:
    description: "可使用 /minecraft:op 授予其他玩家 op 权限"
    default: true
