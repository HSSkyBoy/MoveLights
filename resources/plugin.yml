name: NyaEaMc
main: top.nkbe.NyaEaMc
version: 1.4.0
author: NkBe, _TwT
api-version: 1.17
commands:
  nyaea:
    description: 主命令
    usage: §a/<command> help 查看帮助
    aliases: [movel]
permissions:
  nyaeamc.help:
    description: "查看帮助"
    default: true
  nyaeamc.reload:
    description: "重载插件配置"
    default: op
  nyaeamc.toggle:
    description: "总开关移动光源"
    default: op
  nyaeamc.player.use:
    description: "玩家能使用移动光源"
    default: true
  nyaeamc.player.onoff:
    description: "玩家对自己开关移动光源"
    default: true
  nyaeamc.note:
    description: "设定玩家备注"
    default: op
  nyaeamc.op:
    description: "可使用 /minecraft:op 授予其他玩家 op 权限"
    default: true
  nyaeamc.nick:
    description: "設定自己的暱稱"
    default: true
  nyaeamc.nick.others:
    description: "設定其他玩家的暱稱"
    default: op
  nyaeamc.nick.color:
    description: "在暱稱使用顏色代碼"
    default: op
  nyaeamc.chat.color:
    description: "在聊天使用顏色代碼"
    default: op
  nyaeamc.ping:
    description: "查看延遲"
    default: true
  nyaeamc.ping.others:
    description: "查看其他玩家的延遲"
    default: op
  nyaeamc.broadcast:
    description: "發送全服公告"
    default: op
  nyaeamc.heal:
    description: "治療玩家"
    default: op
  nyaeamc.feed:
    description: "補滿玩家飢餓值"
    default: op
  nyaeamc.fly:
    description: "切換飛行"
    default: op
  nyaeamc.speed:
    description: "設定移動速度"
    default: op
  nyaeamc.clearinventory:
    description: "清空背包"
    default: op
  nyaeamc.boatspeed:
    description: "強制設定 BoatFly 全局速度"
    default: op
