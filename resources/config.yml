# 语言 (zh_TW / zh_CN / en)，讯息档在插件目录 lang/ 下可自行修改
language: zh_TW
# true(开), false(关)
# 是否启用移动光源
enable: true
# 移动光源刷新速度，20为1秒，数值越低效果越好相应的资源占用可能会高
refresh: 5
# 有移动光源效果的物品，其他物品可以自己添加
# 优先级：主手 > 副手 > 头盔 > 胸甲 > 护腿 > 靴子
# 下面的添加物品请严格按照格式，不然会报错
usable:
  # 物品名称
  TORCH:
    # 移动光源等级 0 ~ 15
    lightLevel: 14
    # 穿在身上是否有移动光源
    apparel: false
  SOUL_TORCH:
    lightLevel: 6
    apparel: false
  REDSTONE_TORCH:
    lightLevel: 6
    apparel: false
  LAVA_BUCKET:
    lightLevel: 15
    apparel: false
  GOLD_BLOCK:
    lightLevel: 13
    apparel: false
  GOLD_INGOT:
    lightLevel: 5
    apparel: false
  GOLDEN_CHESTPLATE:
    lightLevel: 9
    apparel: true
  GOLDEN_BOOTS:
    lightLevel: 9
    apparel: true
  GOLDEN_LEGGINGS:
    lightLevel: 9
    apparel: true
  GOLDEN_HELMET:
    lightLevel: 9
    apparel: true
  SHROOMLIGHT:
    lightLevel: 13
    apparel: true
  GLOWSTONE:
    lightLevel: 13
    apparel: true
  GLOW_INK_SAC:
    lightLevel: 4
    apparel: false
  JACK_O_LANTERN:
    lightLevel: 13
    apparel: false
  GOLDEN_APPLE:
    lightLevel: 6
    apparel: false
  ENCHANTED_GOLDEN_APPLE:
    lightLevel: 8
    apparel: false
  LANTERN:
    lightLevel: 13
    apparel: false
  SOUL_LANTERN:
    lightLevel: 13
    apparel: false

# ===== 聊天增強 =====
chat-emoji:
  # 是否启用聊天 emoji 转换 (在聊天中输入 :smile: 这类代码会转换成 emoji)
  enable: true
  # 自定义 emoji，key 为代码(可不含冒号)，value 为要显示的字符
  custom:
    # :tick: : "✔"

chat:
  color:
    # 允許擁有 nyaeamc.chat.color 權限的玩家在聊天使用 & 色碼
    enable: true
  join-message: "&e{0} 加入了伺服器"
  quit-message: "&e{0} 離開了伺服器"

# ===== BoatFly 聯動 =====
boatfly:
  # /boatspeed 設定後會保存並套用給安裝新版 BoatFly 的玩家；-1 代表未設定
  global-speed: -1

# ===== /minecraft:op 指令 =====
op-command:
  # 是否启用 /minecraft:op 授权指令 (关闭时回归原版行为)
  enable: true

# ===== 内建 emoji 资源包 =====
emoji-pack:
  # 是否启动内建资源包伺服器，并把资源包推送给 Java 端玩家
  # (Bedrock/Geyser 跨端原生支持 emoji，不受影响)
  enable: true
  # 资源包伺服器端口
  port: 8399
  # 伺服器对外位址，留空自动侦测；公网/NAT 建议填网域或公网 IP
  host: ""
